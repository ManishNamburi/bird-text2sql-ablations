# Experiment 06 — prompt trimming (T1–T4, D21) on C3: fused metadata, full schema, one call.
# Star design: each T config differs from C3 by exactly one flag. C3 is re-run under the same
# label as in 01, so it must be fully cached (0 new LLM calls) and identical row for row.
#   T1 long -> short profile summaries        T2 example values in summaries masked as '…'
#   T3 BIRD value descriptions dropped        T4 system prompt cut to one line (format kept)
# Run with:  uv run python scripts/run_ablation.py promptfoo/configs/06_trimming.yaml --split dev
description: "06 prompt trimming on C3: short profiles / masked values / no BIRD values / minimal system, hints on/off"

prompts:
  - "{{question}}" # unused by the pipeline provider; it builds its own prompts from vars

providers:
  - id: file://../providers/pipeline.py
    label: C3-fused
    config: { metadata: fused, hints: false }
  - id: file://../providers/pipeline.py
    label: T1-short-profile
    config: { metadata: fused, profile_detail: short, hints: false }
  - id: file://../providers/pipeline.py
    label: T2-masked-values
    config: { metadata: fused, profile_values: false, hints: false }
  - id: file://../providers/pipeline.py
    label: T3-no-bird-values
    config: { metadata: fused, bird_values: false, hints: false }
  - id: file://../providers/pipeline.py
    label: T4-minimal-system
    config: { metadata: fused, system: minimal, hints: false }
  - id: file://../providers/pipeline.py
    label: C3-fused+hints
    config: { metadata: fused, hints: true }
  - id: file://../providers/pipeline.py
    label: T1-short-profile+hints
    config: { metadata: fused, profile_detail: short, hints: true }
  - id: file://../providers/pipeline.py
    label: T2-masked-values+hints
    config: { metadata: fused, profile_values: false, hints: true }
  - id: file://../providers/pipeline.py
    label: T3-no-bird-values+hints
    config: { metadata: fused, bird_values: false, hints: true }
  - id: file://../providers/pipeline.py
    label: T4-minimal-system+hints
    config: { metadata: fused, system: minimal, hints: true }

# Per-config percentages in the web viewer and JSON (named scores are summed per column;
# __count = tests in the column). CIs and paired tests stay in analysis/analyze.py.
derivedMetrics:
  - name: EX_pct
    value: 100 * ex / __count
  - name: valid_sql_pct
    value: 100 * valid_sql / __count

defaultTest:
  assert:
    - type: python
      value: file://../asserts/ex_match.py
      metric: ex
