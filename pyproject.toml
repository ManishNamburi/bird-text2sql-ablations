[project]
name = "birdeval"
version = "0.1.0"
description = "Ablating the AT&T BIRD text-to-SQL pipeline with promptfoo on a local LLM"
requires-python = ">=3.11,<3.13"
dependencies = [
    "sqlglot>=25",
    "datasketch>=1.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "requests>=2.32",
    "matplotlib>=3.9",
    "pyyaml>=6.0.3",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
